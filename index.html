<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>The Seasonal Registry — Wynncraft Guilds</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:        #f4efe1;
    --paper-shade:  #ece6d2;
    --ink:          #1c1814;
    --ink-soft:     #3d3a33;
    --muted:        #8d8472;
    --rule:         #d6cdb5;
    --rule-strong:  #1c1814;
    --gold:         #b8892c;
    --silver:       #7a7670;
    --bronze:       #8a5530;
    --pulse:        #5a8a4a;
    --erratum:      #6b2424;
  }

  * { box-sizing: border-box; }

  html { background: var(--paper); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
    font-feature-settings: 'tnum' 1, 'ss01' 1, 'cv11' 1;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    /* very faint vignette so the cream doesn't feel flat */
    background-image: radial-gradient(ellipse at 50% -10%, rgba(0,0,0,0.035), transparent 55%);
  }

  ::selection { background: var(--ink); color: var(--paper); }

  .wrap {
    max-width: 1020px;
    margin: 0 auto;
    padding: 72px 48px 96px;
  }

  /* ───── Masthead ───────────────────────────────────────────── */
  .masthead { margin-bottom: 28px; }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--muted);
    margin: 0 0 16px;
    font-variation-settings: 'opsz' 14, 'wght' 500;
  }

  h1 {
    margin: 0;
    font-size: clamp(48px, 9vw, 96px);
    line-height: 0.92;
    letter-spacing: -0.025em;
    font-variation-settings: 'opsz' 144, 'wght' 380;
    color: var(--ink);
  }
  h1 em {
    font-style: italic;
    font-variation-settings: 'opsz' 144, 'wght' 320;
  }

  /* ───── Status strip — the consolidated meta line ──────────── */
  .status {
    margin-top: 32px;
    padding: 14px 0 14px;
    border-top: 1px solid var(--rule-strong);
    border-bottom: 1px solid var(--rule);
    display: flex;
    flex-wrap: wrap;
    gap: 22px 30px;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    font-variation-settings: 'opsz' 14, 'wght' 500;
  }
  .status .pulse {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--pulse);
    margin-right: 8px;
    transform: translateY(-1px);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }
  .status strong {
    color: var(--ink);
    font-weight: 500;
    font-variation-settings: 'opsz' 14, 'wght' 600;
    letter-spacing: 0.05em;
  }
  .status .sep {
    color: var(--rule);
    user-select: none;
  }

  /* ───── Table — typeset like a printed ledger ──────────────── */
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 44px;
    font-feature-settings: 'tnum' 1, 'lnum' 1;
  }

  thead th {
    text-align: left;
    font-size: 10.5px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--muted);
    padding: 0 14px 10px;
    border-bottom: 1px solid var(--rule-strong);
    font-variation-settings: 'opsz' 14, 'wght' 500;
  }
  thead th.num { text-align: right; }
  thead th.rank-col { width: 76px; padding-left: 4px; }

  tbody td {
    padding: 16px 14px;
    border-bottom: 1px solid var(--rule);
    vertical-align: baseline;
    font-variation-settings: 'opsz' 20, 'wght' 400;
  }
  tbody td.rank-col { padding-left: 4px; }

  tbody tr {
    animation: rise 0.55s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  tbody tr:hover td { background: rgba(0,0,0,0.018); }

  .rank {
    font-variation-settings: 'opsz' 144, 'wght' 380;
    font-size: 24px;
    color: var(--muted);
    font-feature-settings: 'tnum' 1, 'lnum' 1;
    letter-spacing: -0.01em;
  }

  tr.top1 .rank { color: var(--gold);   font-variation-settings: 'opsz' 144, 'wght' 480; font-size: 32px; }
  tr.top2 .rank { color: var(--silver); font-variation-settings: 'opsz' 144, 'wght' 460; font-size: 28px; }
  tr.top3 .rank { color: var(--bronze); font-variation-settings: 'opsz' 144, 'wght' 460; font-size: 28px; }

  .guild-name {
    font-size: 19px;
    font-variation-settings: 'opsz' 24, 'wght' 420;
    color: var(--ink);
  }
  tr.top1 .guild-name { font-variation-settings: 'opsz' 24, 'wght' 520; }

  .guild-prefix {
    font-style: italic;
    font-size: 13.5px;
    color: var(--muted);
    margin-left: 10px;
    font-variation-settings: 'opsz' 14, 'wght' 380;
    letter-spacing: 0.02em;
  }

  .stale-note {
    margin-left: 12px;
    font-style: italic;
    font-size: 11px;
    color: var(--erratum);
    letter-spacing: 0.06em;
  }

  td.num {
    text-align: right;
    font-variant-numeric: tabular-nums lining-nums;
    font-feature-settings: 'tnum' 1, 'lnum' 1;
  }
  .sr {
    font-size: 19px;
    color: var(--ink);
    font-variation-settings: 'opsz' 20, 'wght' 440;
  }
  tr.top1 .sr { font-variation-settings: 'opsz' 20, 'wght' 540; }
  .sr-gap {
    display: inline-block;
    margin-left: 10px;
    font-size: 12.5px;
    font-style: italic;
    color: var(--muted);
    font-variation-settings: 'opsz' 14, 'wght' 380;
    font-variant-numeric: tabular-nums lining-nums;
    letter-spacing: 0.01em;
  }
  .stat {
    font-size: 15px;
    color: var(--ink-soft);
    font-variation-settings: 'opsz' 14, 'wght' 380;
  }

  /* loading + empty */
  .placeholder {
    padding: 56px 12px;
    text-align: center;
    color: var(--muted);
    font-style: italic;
    font-size: 15px;
  }

  /* ───── Errata block ───────────────────────────────────────── */
  .errata {
    margin-top: 32px;
    padding: 18px 22px;
    border-left: 2px solid var(--erratum);
    background: rgba(107,36,36,0.035);
    color: var(--erratum);
    font-size: 13.5px;
    font-style: italic;
    font-variation-settings: 'opsz' 14, 'wght' 380;
  }
  .errata b {
    font-style: normal;
    font-variation-settings: 'opsz' 14, 'wght' 600;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 11px;
    margin-right: 10px;
  }

  /* ───── Colophon ───────────────────────────────────────────── */
  .colophon {
    margin-top: 72px;
    padding-top: 18px;
    border-top: 1px solid var(--rule-strong);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 10.5px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    font-variation-settings: 'opsz' 14, 'wght' 500;
  }
  .colophon a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--rule); }
  .colophon a:hover { color: var(--ink); border-bottom-color: var(--ink); }

  /* ───── Responsive ─────────────────────────────────────────── */
  @media (max-width: 720px) {
    .wrap { padding: 44px 22px 64px; }
    h1 { font-size: clamp(40px, 12vw, 64px); }
    .status { gap: 12px 18px; font-size: 10px; letter-spacing: 0.18em; }
    .status .sep { display: none; }
    thead th { padding: 0 8px 8px; font-size: 9.5px; letter-spacing: 0.18em; }
    tbody td { padding: 13px 8px; }
    .guild-name { font-size: 16px; }
    .sr { font-size: 16px; }
    .rank { font-size: 20px; }
    tr.top1 .rank { font-size: 26px; }
    tr.top2 .rank, tr.top3 .rank { font-size: 23px; }
    .col-hide-sm { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="eyebrow">Wynncraft &nbsp;·&nbsp; <span id="season-eyebrow">Guild Wars</span></div>
    <h1>The Seasonal&nbsp;<em>Registry</em></h1>
  </header>

  <div class="status">
    <span><span class="pulse"></span>Live</span>
    <span class="sep">|</span>
    <span>Tracking <strong id="count">—</strong> guilds</span>
    <span class="sep">|</span>
    <span>Updated <strong id="updated">…</strong></span>
    <span class="sep">|</span>
    <span>Refreshes every 5 minutes</span>
  </div>

  <table>
    <thead>
      <tr>
        <th class="rank-col">№</th>
        <th>Guild</th>
        <th class="num">Seasonal Rating</th>
        <th class="num col-hide-sm">Level</th>
        <th class="num col-hide-sm">Territories</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="5" class="placeholder">Awaiting transmission…</td></tr>
    </tbody>
  </table>

  <div id="errors"></div>

  <footer class="colophon">
    <span>The Seasonal Registry &nbsp;·&nbsp; Vol. I</span>
    <span><a href="https://github.com/Teslanator20/srlb" target="_blank" rel="noopener">Sources on GitHub</a></span>
  </footer>

</div>

<script>
const fmt = (n) => (n ?? 0).toLocaleString("en-US");

function timeAgo(iso) {
  if (!iso) return "—";
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60)    return `${Math.floor(diff)} sec ago`;
  if (diff < 3600)  return `${Math.floor(diff / 60)} min ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)} h ago`;
  return `${Math.floor(diff / 86400)} d ago`;
}

function rankClass(i) {
  if (i === 1) return "top1";
  if (i === 2) return "top2";
  if (i === 3) return "top3";
  return "";
}

function render(data) {
  document.getElementById("updated").textContent = timeAgo(data.updated);
  document.getElementById("count").textContent   = (data.guilds || []).length;

  if (data.season != null) {
    document.getElementById("season-eyebrow").textContent = `Guild Wars · Season ${data.season}`;
  }

  const tbody = document.getElementById("rows");
  if (!data.guilds || !data.guilds.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="placeholder">No entries yet. Awaiting the first transmission.</td></tr>';
  } else {
    tbody.innerHTML = data.guilds.map((g, idx, arr) => {
      const cls = rankClass(g.rank);
      const stale = (!g.isCurrentSeason && g.season != null)
        ? `<span class="stale-note">stale · season ${g.season}</span>` : "";
      const next = arr[idx + 1];
      const gap = (next && g.rating > 0)
        ? `<span class="sr-gap">+${fmt(g.rating - next.rating)}</span>` : "";
      return `<tr class="${cls}" style="animation-delay:${Math.min(idx, 20) * 0.025}s">
        <td class="rank-col"><span class="rank">${g.rank}</span></td>
        <td>
          <span class="guild-name">${g.name}</span>${g.prefix ? `<span class="guild-prefix">${g.prefix}</span>` : ""}${stale}
        </td>
        <td class="num"><span class="sr">${fmt(g.rating)}</span>${gap}</td>
        <td class="num col-hide-sm"><span class="stat">${fmt(g.level)}</span></td>
        <td class="num col-hide-sm"><span class="stat">${fmt(g.territories)}</span></td>
      </tr>`;
    }).join("");
  }

  const errBox = document.getElementById("errors");
  if (data.errors && data.errors.length) {
    errBox.innerHTML = `<div class="errata"><b>Errata</b>${
      data.errors.map(e => `${e.name} <span style="opacity:0.6">(${e.error})</span>`).join(" &nbsp;·&nbsp; ")
    }</div>`;
  } else {
    errBox.innerHTML = "";
  }
}

async function load() {
  try {
    const r = await fetch("data.json?_=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
  } catch (e) {
    document.getElementById("updated").textContent = "error";
    console.error(e);
  }
}

load();
setInterval(load, 60_000);
</script>
</body>
</html>
