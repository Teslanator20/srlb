<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Seasonal Rating Standings — Wynncraft</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:        #f4efe1;
    --paper-shade:  #ece6d2;
    --ink:          #1c1814;
    --ink-soft:     #3d3a33;
    --muted:        #8d8472;
    --rule:         #d6cdb5;
    --rule-strong:  #1c1814;
    --gold:         #b8892c;
    --silver:       #7a7670;
    --bronze:       #8a5530;
    --pulse:        #5a8a4a;
    --erratum:      #6b2424;
    --vignette:     rgba(0,0,0,0.035);
    --row-hover:    rgba(0,0,0,0.018);
    --errata-bg:    rgba(107,36,36,0.035);
  }

  html[data-theme="dark"] {
    --paper:        #16140f;
    --paper-shade:  #1f1c15;
    --ink:          #ece6d2;
    --ink-soft:     #c8c1ac;
    --muted:        #8a8270;
    --rule:         #3a342a;
    --rule-strong:  #ece6d2;
    --gold:         #d4a04a;
    --silver:       #b8b3a4;
    --bronze:       #c2864e;
    --pulse:        #7eb56a;
    --erratum:      #d77878;
    --vignette:     rgba(255,245,220,0.04);
    --row-hover:    rgba(255,245,220,0.028);
    --errata-bg:    rgba(215,120,120,0.05);
  }

  * { box-sizing: border-box; }

  html { background: var(--paper); transition: background-color 0.3s ease; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-feature-settings: 'tnum' 1, 'cv11' 1;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    background-image: radial-gradient(ellipse at 50% -10%, var(--vignette), transparent 55%);
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  ::selection { background: var(--ink); color: var(--paper); }

  .wrap {
    max-width: 1020px;
    margin: 0 auto;
    padding: 72px 48px 96px;
    position: relative;
  }

  /* ───── Theme toggle (top-right) ────────────────────────────── */
  .theme-toggle {
    position: absolute;
    top: 40px;
    right: 48px;
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 7px 14px 7px 12px;
    font-family: inherit;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .theme-toggle:hover { color: var(--ink); border-color: var(--ink); }
  .theme-toggle .glyph {
    display: inline-block;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--ink);
    box-shadow: inset -3px -3px 0 0 var(--paper);
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  html[data-theme="dark"] .theme-toggle .glyph {
    background: var(--paper);
    box-shadow: inset -3px -3px 0 0 var(--paper-shade);
  }
  @media (max-width: 720px) {
    .theme-toggle { top: 22px; right: 22px; padding: 6px 11px 6px 9px; font-size: 9.5px; }
  }

  /* ───── Masthead ───────────────────────────────────────────── */
  .masthead { margin-bottom: 28px; }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--muted);
    margin: 0 0 14px;
  }

  h1 {
    margin: 0;
    font-family: 'Fraunces', Georgia, serif;
    font-size: clamp(34px, 5.5vw, 52px);
    line-height: 1.05;
    letter-spacing: -0.015em;
    font-variation-settings: 'opsz' 96, 'wght' 500;
    color: var(--ink);
  }
  h1 em {
    font-style: italic;
    font-variation-settings: 'opsz' 96, 'wght' 420;
  }

  /* ───── Status strip — the consolidated meta line ──────────── */
  .status {
    margin-top: 28px;
    padding: 12px 0;
    border-top: 1px solid var(--rule-strong);
    border-bottom: 1px solid var(--rule);
    display: flex;
    flex-wrap: wrap;
    gap: 18px 28px;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }
  .status .pulse {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--pulse);
    margin-right: 8px;
    transform: translateY(-1px);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }
  .status strong {
    color: var(--ink);
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .status .sep {
    color: var(--rule);
    user-select: none;
  }

  /* ───── Table — typeset like a printed ledger ──────────────── */
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 44px;
    font-feature-settings: 'tnum' 1, 'lnum' 1;
  }

  thead th {
    text-align: left;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--muted);
    padding: 0 14px 10px;
    border-bottom: 1px solid var(--rule-strong);
  }
  thead th.num { text-align: right; }
  thead th.rank-col { width: 76px; padding-left: 4px; }

  tbody td {
    padding: 14px;
    border-bottom: 1px solid var(--rule);
    vertical-align: baseline;
    font-weight: 400;
  }
  tbody td.rank-col { padding-left: 4px; }

  tbody tr {
    animation: rise 0.55s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  tbody tr:hover td { background: var(--row-hover); }

  .rank {
    font-size: 18px;
    color: var(--muted);
    font-weight: 500;
    font-feature-settings: 'tnum' 1, 'lnum' 1;
  }

  tr.top1 .rank { color: var(--gold);   font-weight: 700; font-size: 22px; }
  tr.top2 .rank { color: var(--silver); font-weight: 600; font-size: 20px; }
  tr.top3 .rank { color: var(--bronze); font-weight: 600; font-size: 20px; }

  .guild-name {
    font-size: 15.5px;
    font-weight: 500;
    color: var(--ink);
  }
  tr.top1 .guild-name { font-weight: 600; }

  .guild-prefix {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-size: 13px;
    color: var(--muted);
    margin-left: 8px;
    font-variation-settings: 'opsz' 14, 'wght' 400;
  }

  .stale-note {
    margin-left: 12px;
    font-size: 11px;
    color: var(--erratum);
    letter-spacing: 0.04em;
  }

  td.num {
    text-align: right;
    font-variant-numeric: tabular-nums lining-nums;
    font-feature-settings: 'tnum' 1, 'lnum' 1;
  }
  .sr {
    font-size: 16px;
    color: var(--ink);
    font-weight: 500;
    font-variant-numeric: tabular-nums lining-nums;
  }
  tr.top1 .sr { font-weight: 600; }
  .sr-gap {
    display: inline-block;
    margin-left: 10px;
    font-size: 12.5px;
    color: var(--ink-soft);
    font-weight: 500;
    font-variant-numeric: tabular-nums lining-nums;
  }
  .stat {
    font-size: 14px;
    color: var(--ink-soft);
    font-weight: 400;
  }

  /* loading + empty */
  .placeholder {
    padding: 56px 12px;
    text-align: center;
    color: var(--muted);
    font-style: italic;
    font-size: 15px;
  }

  /* ───── Errata block ───────────────────────────────────────── */
  .errata {
    margin-top: 32px;
    padding: 16px 20px;
    border-left: 2px solid var(--erratum);
    background: var(--errata-bg);
    color: var(--erratum);
    font-size: 13px;
    font-weight: 400;
  }
  .errata b {
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 11px;
    margin-right: 10px;
  }

  /* ───── Colophon ───────────────────────────────────────────── */
  .colophon {
    margin-top: 64px;
    padding-top: 16px;
    border-top: 1px solid var(--rule-strong);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }
  .colophon a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--rule); }
  .colophon a:hover { color: var(--ink); border-bottom-color: var(--ink); }

  /* ───── Responsive ─────────────────────────────────────────── */
  @media (max-width: 720px) {
    .wrap { padding: 44px 22px 64px; }
    h1 { font-size: clamp(40px, 12vw, 64px); }
    .status { gap: 12px 18px; font-size: 10px; letter-spacing: 0.18em; }
    .status .sep { display: none; }
    thead th { padding: 0 8px 8px; font-size: 9.5px; letter-spacing: 0.12em; }
    tbody td { padding: 12px 8px; }
    .guild-name { font-size: 14px; }
    .sr { font-size: 14px; }
    .rank { font-size: 15px; }
    tr.top1 .rank { font-size: 19px; }
    tr.top2 .rank, tr.top3 .rank { font-size: 17px; }
    .col-hide-sm { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
    <span class="glyph"></span>
    <span id="theme-label">Dark</span>
  </button>

  <header class="masthead">
    <div class="eyebrow">Wynncraft &nbsp;·&nbsp; <span id="season-eyebrow">Season —</span></div>
    <h1>Seasonal Rating&nbsp;<em>Standings</em></h1>
  </header>

  <div class="status">
    <span><span class="pulse"></span>Live</span>
    <span class="sep">|</span>
    <span>Tracking <strong id="count">—</strong> guilds</span>
    <span class="sep">|</span>
    <span>Updated <strong id="updated">…</strong></span>
    <span class="sep">|</span>
    <span>Refreshes every 5 minutes</span>
  </div>

  <table>
    <thead>
      <tr>
        <th class="rank-col">№</th>
        <th>Guild</th>
        <th class="num">Seasonal Rating</th>
        <th class="num col-hide-sm">Level</th>
        <th class="num col-hide-sm">Territories</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="5" class="placeholder">Awaiting transmission…</td></tr>
    </tbody>
  </table>

  <div id="errors"></div>

  <footer class="colophon">
    <span>Seasonal Rating Standings</span>
  </footer>

</div>

<script>
// ───── Theme handling ─────
(function () {
  const stored = localStorage.getItem("theme");
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  const initial = stored || (prefersDark ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", initial);
})();

function syncThemeLabel() {
  const current = document.documentElement.getAttribute("data-theme");
  document.getElementById("theme-label").textContent = current === "dark" ? "Light" : "Dark";
}
syncThemeLabel();

document.getElementById("theme-toggle").addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
  syncThemeLabel();
});

const fmt = (n) => (n ?? 0).toLocaleString("en-US");

function timeAgo(iso) {
  if (!iso) return "—";
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60)    return `${Math.floor(diff)} sec ago`;
  if (diff < 3600)  return `${Math.floor(diff / 60)} min ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)} h ago`;
  return `${Math.floor(diff / 86400)} d ago`;
}

function rankClass(i) {
  if (i === 1) return "top1";
  if (i === 2) return "top2";
  if (i === 3) return "top3";
  return "";
}

function render(data) {
  document.getElementById("updated").textContent = timeAgo(data.updated);
  document.getElementById("count").textContent   = (data.guilds || []).length;

  if (data.season != null) {
    document.getElementById("season-eyebrow").textContent = `Season ${data.season}`;
  }

  const tbody = document.getElementById("rows");
  if (!data.guilds || !data.guilds.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="placeholder">No entries yet. Awaiting the first transmission.</td></tr>';
  } else {
    tbody.innerHTML = data.guilds.map((g, idx, arr) => {
      const cls = rankClass(g.rank);
      const stale = (!g.isCurrentSeason && g.season != null)
        ? `<span class="stale-note">stale · season ${g.season}</span>` : "";
      const next = arr[idx + 1];
      const gap = (next && g.rating > 0)
        ? `<span class="sr-gap">+${fmt(g.rating - next.rating)}</span>` : "";
      return `<tr class="${cls}" style="animation-delay:${Math.min(idx, 20) * 0.025}s">
        <td class="rank-col"><span class="rank">${g.rank}</span></td>
        <td>
          <span class="guild-name">${g.name}</span>${g.prefix ? `<span class="guild-prefix">${g.prefix}</span>` : ""}${stale}
        </td>
        <td class="num"><span class="sr">${fmt(g.rating)}</span>${gap}</td>
        <td class="num col-hide-sm"><span class="stat">${fmt(g.level)}</span></td>
        <td class="num col-hide-sm"><span class="stat">${fmt(g.territories)}</span></td>
      </tr>`;
    }).join("");
  }

  const errBox = document.getElementById("errors");
  if (data.errors && data.errors.length) {
    errBox.innerHTML = `<div class="errata"><b>Errata</b>${
      data.errors.map(e => `${e.name} <span style="opacity:0.6">(${e.error})</span>`).join(" &nbsp;·&nbsp; ")
    }</div>`;
  } else {
    errBox.innerHTML = "";
  }
}

async function load() {
  try {
    const r = await fetch("data.json?_=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
  } catch (e) {
    document.getElementById("updated").textContent = "error";
    console.error(e);
  }
}

load();
setInterval(load, 60_000);
</script>
</body>
</html>
